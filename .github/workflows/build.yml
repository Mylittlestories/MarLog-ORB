name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Verify Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - name: Generate fresh Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Stage APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MarLog_ORB_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/MarLog_ORB_Android.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build Electron Windows installer
        run: npx electron-builder --win --publish never
      - name: Stage Windows artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path electron-release | Out-Null
          Copy-Item release\*.exe electron-release\ -ErrorAction Stop
          if (Test-Path release\win-unpacked) {
            Compress-Archive -Path release\win-unpacked\* -DestinationPath electron-release\MarLog_ORB_Windows_Portable.zip -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: electron-release/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: artifacts-web/
      - name: Package ready-to-use web app
        shell: bash
        run: |
          # Static web bundle that can be served by any static host (or opened via
          # a local server) with no build step. Includes the PWA manifest + icons.
          cd artifacts-web
          zip -r ../MarLog_ORB_Web.zip .
          cd ../
          ls -lh MarLog_ORB_Web.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MarLog ORB ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/MarLog_ORB_Android.apk
            artifacts/*.exe
            artifacts/MarLog_ORB_Windows_Portable.zip
            MarLog_ORB_Web.zip
