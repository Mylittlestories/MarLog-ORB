# TEMPORARY one-off: build the portable single-file Windows .exe from the
# current main (which has the portable electron-builder config) and attach it
# to the existing v3.0.0 release without changing the version.
name: Build portable exe (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build portable single-file exe
        run: npx electron-builder --win portable --publish never
      - name: List build output
        shell: powershell
        run: Get-ChildItem release\*.exe | Select-Object Name,Length
      - name: Upload to v3.0.0 release (no version change)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: MarLog ORB v3.0.0
          files: |
            release\*Portable*.exe
          fail_on_unmatched_files: false
