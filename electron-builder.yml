appId: com.marlog.orb
productName: MarLog ORB
copyright: Copyright © 2026 MarLog
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - "!**/node_modules/**/*"
  - package.json
asar: true
electronVersion: 41.7.1
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "MarLog ORB"
portable:
  artifactName: "${productName}_${version}_Windows_x64_Portable.exe"
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office;Utility;
extraResources:
  - from: public/
    to: public/
