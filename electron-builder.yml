main: electron/main.cjs
appId: com.marlog.orb
productName: MarLog ORB
copyright: Copyright © 2026 MarLog

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - "!node_modules/**/*"

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}_${version}_Windows_x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MarLog ORB

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office

extraResources:
  - from: public/
    to: public/
